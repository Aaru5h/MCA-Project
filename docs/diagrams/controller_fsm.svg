<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="fsmShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="fsmArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="fsmArrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="fsmArrowAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="fsmArrowRose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="45" font-size="22" font-weight="700" fill="#f8fafc">Controller Finite State Machine (FSM)</text>
  <text x="40" y="68" font-size="13" fill="#94a3b8">Consistent with Deepak's rtl/dm_cache.v: 5 States, Synchronous Reset &amp; Configurable Write-Allocate</text>

  <!-- STATE: S_IDLE -->
  <g transform="translate(80, 260)" filter="url(#fsmShadow)">
    <rect width="180" height="110" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="90" y="32" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">S_IDLE</text>
    <text x="90" y="49" font-size="11" fill="#94a3b8" text-anchor="middle">Encoding: 3'd0</text>
    <line x1="15" y1="57" x2="165" y2="57" stroke="#334155" stroke-width="1"/>
    <text x="90" y="74" font-size="11" fill="#cbd5e1" text-anchor="middle">busy = 0, cpu_ready = 0</text>
    <text x="90" y="91" font-size="10" fill="#64748b" text-anchor="middle">Wait for cpu_req == 1</text>
  </g>

  <!-- STATE: S_COMPARE -->
  <g transform="translate(390, 260)" filter="url(#fsmShadow)">
    <rect width="200" height="110" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="2.5"/>
    <text x="100" y="32" font-size="15" font-weight="700" fill="#818cf8" text-anchor="middle">S_COMPARE</text>
    <text x="100" y="49" font-size="11" fill="#94a3b8" text-anchor="middle">Encoding: 3'd1</text>
    <line x1="15" y1="57" x2="185" y2="57" stroke="#334155" stroke-width="1"/>
    <text x="100" y="74" font-size="11" fill="#cbd5e1" text-anchor="middle">Tag check: is_hit</text>
    <text x="100" y="91" font-size="10" fill="#c7d2fe" text-anchor="middle">hit_count++ / miss_count++</text>
  </g>

  <!-- STATE: S_ALLOCATE -->
  <g transform="translate(380, 480)" filter="url(#fsmShadow)">
    <rect width="220" height="120" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
    <text x="110" y="30" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">S_ALLOCATE</text>
    <text x="110" y="47" font-size="11" fill="#94a3b8" text-anchor="middle">Encoding: 3'd2</text>
    <line x1="15" y1="55" x2="205" y2="55" stroke="#334155" stroke-width="1"/>
    <text x="110" y="72" font-size="10" fill="#cbd5e1" text-anchor="middle">Refill beat 0..3 on mem_ready</text>
    <text x="110" y="88" font-size="10" fill="#a7f3d0" text-anchor="middle">Overlay wdata if req_we &amp; WA=1</text>
    <text x="110" y="104" font-size="9" fill="#6ee7b7" text-anchor="middle">Commit valid_arr &amp; tag_arr</text>
  </g>

  <!-- STATE: S_WRITE -->
  <g transform="translate(710, 480)" filter="url(#fsmShadow)">
    <rect width="210" height="120" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="105" y="30" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle">S_WRITE</text>
    <text x="105" y="47" font-size="11" fill="#94a3b8" text-anchor="middle">Encoding: 3'd3</text>
    <line x1="15" y1="55" x2="195" y2="55" stroke="#334155" stroke-width="1"/>
    <text x="105" y="72" font-size="10" fill="#cbd5e1" text-anchor="middle">Write-through to memory</text>
    <text x="105" y="88" font-size="10" fill="#fde68a" text-anchor="middle">mem_req = 1, mem_we = 1</text>
    <text x="105" y="104" font-size="9" fill="#94a3b8" text-anchor="middle">Wait for mem_ready pulse</text>
  </g>

  <!-- STATE: S_RESPOND -->
  <g transform="translate(710, 260)" filter="url(#fsmShadow)">
    <rect width="200" height="110" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="2.5"/>
    <text x="100" y="32" font-size="15" font-weight="700" fill="#ec4899" text-anchor="middle">S_RESPOND</text>
    <text x="100" y="49" font-size="11" fill="#94a3b8" text-anchor="middle">Encoding: 3'd4</text>
    <line x1="15" y1="57" x2="185" y2="57" stroke="#334155" stroke-width="1"/>
    <text x="100" y="74" font-size="11" fill="#cbd5e1" text-anchor="middle">cpu_ready &lt;= 1'b1 (1 cycle)</text>
    <text x="100" y="91" font-size="10" fill="#f472b6" text-anchor="middle">cpu_rdata valid on read</text>
  </g>

  <!-- TRANSITIONS -->
  
  <!-- IDLE -> COMPARE -->
  <path d="M 260 315 L 388 315" stroke="#38bdf8" stroke-width="2" marker-end="url(#fsmArrow)"/>
  <rect x="272" y="293" width="104" height="18" rx="4" fill="#0f172a" stroke="#0284c7"/>
  <text x="324" y="306" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">cpu_req == 1</text>

  <!-- IDLE self loop -->
  <path d="M 140 260 C 140 215, 200 215, 200 258" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#fsmArrow)"/>
  <text x="170" y="210" font-size="10" fill="#64748b" text-anchor="middle">!cpu_req</text>

  <!-- COMPARE -> RESPOND (Read Hit) -->
  <path d="M 590 315 L 708 315" stroke="#34d399" stroke-width="2.5" marker-end="url(#fsmArrowGreen)"/>
  <rect x="608" y="280" width="86" height="30" rx="4" fill="#0f172a" stroke="#059669"/>
  <text x="651" y="294" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Read Hit</text>
  <text x="651" y="306" font-size="9" fill="#a7f3d0" text-anchor="middle">is_hit &amp;&amp; !req_we</text>

  <!-- COMPARE -> WRITE (Write Hit OR Write Miss with WA=0) -->
  <path d="M 570 370 C 620 420, 680 440, 740 478" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#fsmArrowAmber)"/>
  <rect x="635" y="415" width="125" height="28" rx="4" fill="#0f172a" stroke="#d97706"/>
  <text x="697" y="428" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">Write Hit | (Miss &amp; WA=0)</text>
  <text x="697" y="439" font-size="8" fill="#fde68a" text-anchor="middle">req_we &amp;&amp; (is_hit || !WA)</text>

  <!-- COMPARE -> ALLOCATE (Read Miss OR Write Miss with WA=1) -->
  <path d="M 470 370 L 470 478" stroke="#38bdf8" stroke-width="2" marker-end="url(#fsmArrow)"/>
  <rect x="365" y="410" width="100" height="28" rx="4" fill="#0f172a" stroke="#0284c7"/>
  <text x="415" y="423" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">Read Miss |</text>
  <text x="415" y="434" font-size="8" fill="#93c5fd" text-anchor="middle">(Write Miss &amp; WA=1)</text>

  <!-- ALLOCATE self loop (Burst refill beats) -->
  <path d="M 400 600 C 400 655, 460 655, 460 602" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#fsmArrowGreen)"/>
  <text x="430" y="662" font-size="9" fill="#34d399" text-anchor="middle">mem_ready &amp;&amp; beat &lt; 3 (beat++)</text>

  <!-- ALLOCATE -> RESPOND (Read Miss complete) -->
  <path d="M 410 480 C 410 390, 600 350, 715 350" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#fsmArrowGreen)"/>
  <rect x="490" y="365" width="135" height="18" rx="4" fill="#0f172a" stroke="#059669"/>
  <text x="557" y="378" font-size="9" font-weight="600" fill="#34d399" text-anchor="middle">Read Miss Done (!req_we)</text>

  <!-- ALLOCATE -> WRITE (Write Miss complete with WA=1) -->
  <path d="M 600 540 L 708 540" stroke="#f43f5e" stroke-width="2" marker-end="url(#fsmArrowRose)"/>
  <rect x="612" y="520" width="85" height="28" rx="4" fill="#0f172a" stroke="#e11d48"/>
  <text x="654" y="533" font-size="9" font-weight="700" fill="#f43f5e" text-anchor="middle">Refill Done (req_we)</text>
  <text x="654" y="544" font-size="8" fill="#fda4af" text-anchor="middle">Start write-through</text>

  <!-- WRITE -> RESPOND -->
  <path d="M 815 480 L 815 372" stroke="#fbbf24" stroke-width="2" marker-end="url(#fsmArrowAmber)"/>
  <rect x="822" y="415" width="85" height="26" rx="4" fill="#0f172a" stroke="#d97706"/>
  <text x="864" y="428" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">mem_ready == 1</text>
  <text x="864" y="438" font-size="8" fill="#fde68a" text-anchor="middle">Write committed</text>

  <!-- RESPOND -> IDLE -->
  <path d="M 810 260 C 810 120, 170 120, 170 258" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#fsmArrow)"/>
  <rect x="440" y="110" width="120" height="20" rx="4" fill="#0f172a" stroke="#db2777"/>
  <text x="500" y="124" font-size="10" font-weight="700" fill="#ec4899" text-anchor="middle">1 Cycle =&gt; Return IDLE</text>

  <!-- SYNCHRONOUS RESET & DEFAULT RECOVERY -->
  <g transform="translate(80, 640)">
    <rect width="840" height="42" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">Synchronous Reset (!rst_n) &amp; Default Recovery:</text>
    <text x="20" y="32" font-size="10" fill="#cbd5e1">Active-low synchronous reset returns any state immediately to <tspan font-weight="700" fill="#38bdf8">S_IDLE</tspan>, clears all valid bits, resets counters, and cancels memory requests. Unused states recover gracefully to S_IDLE with invalidation.</text>
  </g>
</svg>
